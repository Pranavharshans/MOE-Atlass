name: CI

on:
  push:
    branches: [main, feat/prd-completion]
  pull_request:

jobs:
  model-free-gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync locked environment (dev extra only)
        run: uv sync --locked --extra dev
      - name: Unit and contract tests
        run: uv run --locked pytest -q
      - name: Lint
        run: uv run --locked ruff check src tests
      - name: Unittest discovery baseline
        run: uv run --locked python -m unittest discover -s tests -t .
      - name: Build wheel and sdist
        run: uv build --no-sources
