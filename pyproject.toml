[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "moeatlas"
version = "0.1.0"
description = "Local-first observability and experimentation for Mixture-of-Experts models."
readme = { file = "readme.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "MoEAtlas contributors" },
]
keywords = ["mixture-of-experts", "moe", "observability", "interpretability", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Transformers loads optimized MoE kernels such as DeepGEMM lazily from
    # the Hugging Face Kernel Hub.  Keep the lightweight loader in the base
    # installation so a normal ``pip install -e .`` is sufficient on GPU VMs.
    "kernels~=0.16.0",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# Kept optional so importing and testing the foundation never pulls a model
# runtime or a large accelerator stack into a contributor's environment.
dev = [
    "duckdb>=1.4.5,<1.5",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pytest>=8.3,<9",
    "ruff>=0.12,<0.13",
    "uvicorn>=0.30",
]
store = [
    "duckdb>=1.4.5,<1.5",
]
server = [
    # The server's run worker streams Hugging Face datasets for dataset-backed
    # studies, so keep this dependency with the documented server install.
    "datasets>=3.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]
model = [
    "accelerate>=1.0",
    # CLI model runs can also consume hf_datasets descriptors.
    "datasets>=3.0",
    "safetensors>=0.5",
    "torch>=2.5",
    "transformers>=4.50",
]

[project.scripts]
moeatlas = "moeatlas.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
moeatlas = ["py.typed", "server/static/*", "server/static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
